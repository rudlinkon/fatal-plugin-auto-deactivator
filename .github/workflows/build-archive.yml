name: Generate Plugin Archive
on:
  workflow_dispatch

jobs:
  generate-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generating zip
        uses: rudlinkon/action-wordpress-build-zip@master
        with:
          retention-days: 7 # Optional; defaults to 3
          # The built admin CSS is committed, so there is nothing to build here.
          # (Tailwind v4 also needs Node >= 20, which this action does not provide.)
          npm-run-build: false # Optional; defaults to false
