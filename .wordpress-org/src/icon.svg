<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Fatal Plugin Auto Deactivator">
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
			<stop offset="0" stop-color="#3a94d4"/>
			<stop offset="0.55" stop-color="#2271b1"/>
			<stop offset="1" stop-color="#144a76"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.22" cy="0.14" r="0.85">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
			<stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="shield" x1="0.2" y1="0" x2="0.8" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#e8f1f9"/>
		</linearGradient>
	</defs>

	<rect width="256" height="256" rx="56" fill="url(#tile)"/>

	<!-- Soft top-left glow so the tile is not a flat slab at small sizes. -->
	<rect width="256" height="256" rx="56" fill="url(#glow)"/>

	<!-- Shield: the plugin's own masthead mark, scaled off the 24px icon grid. -->
	<g transform="translate(20 12) scale(9)">
		<path d="M12 3l7 3v5.5c0 4.4-3 7.4-7 9.5-4-2.1-7-5.1-7-9.5V6z" fill="url(#shield)"/>
	</g>

	<!-- Power symbol: protection by switching off. -->
	<g transform="translate(72.8 54) scale(4.6)" fill="none" stroke="#1b5e94" stroke-width="2.1" stroke-linecap="round">
		<path d="M12 3.4v8.2"/>
		<path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
	</g>
</svg>
